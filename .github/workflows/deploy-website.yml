name: Deploy website
permissions: read-all
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to deploy the static website from'
        required: true
        default: 'main'
        type: string
      destination_prefix:
        description: 'Deploy to this path prefix (leave empty for current version)'
        type: string
  workflow_call:
    inputs:
      source_branch:
        description: 'Branch to deploy the website from'
        required: true
        type: string
      destination_prefix:
        description: 'Deploy to this path prefix (leave empty for current version)'
        type: string
jobs:
  linting:
    uses: ./.github/workflows/linting.yml
  build_and_deploy_website:
    needs: linting
    if: ${{ always() && (needs.linting.result == 'success' || needs.linting.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          submodules: false
      - name: Check out DOSVBox website
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          path: dosvbox-source
          submodules: false
      - name: Check out GitHub Pages repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACCESS_TOKEN_REPO }}
          repository: dosbox-staging/dosbox-staging.github.io
          ref: master
          path: dosbox-staging.github.io
          submodules: false
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R dosvbox-source/website/. "$RUNNER_TEMP/site/"
          rm -f "$RUNNER_TEMP/site/.gitignore"
          REV=$(git -C dosvbox-source rev-parse --short HEAD)
          echo "source_git_hash=$REV" >> "$GITHUB_ENV"
      - name: Set destination
        run: |
          if [[ -z "${{ inputs.destination_prefix }}" ]]; then
            echo "dest_path_prefix=." >> "$GITHUB_ENV"
          else
            echo "dest_path_prefix=preview/${{ inputs.destination_prefix }}" >> "$GITHUB_ENV"
          fi
      - name: Configure Git
        run: |
          cd dosbox-staging.github.io
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
      - name: Publish static site
        uses: ./.github/actions/retry
        with:
          cmd: |
            set -e
            cd dosbox-staging.github.io
            git fetch origin master
            git reset --hard FETCH_HEAD
            git clean -fdx
            if [[ -d "${{ env.dest_path_prefix }}" ]]; then
              (
                cd "${{ env.dest_path_prefix }}"
                FILES=$(find . -not -path '*/\.*' -not -path "." -not -path "./static" -not -path "./static/*" -not -path "./tools" -not -path "./tools/*" -not -path "./preview" -not -path "./preview/*" -not -path "./README.md" -not -path "./CNAME" -not -path "./0.82" -not -path "./0.82/*")
                if [[ -n "$FILES" ]]; then echo "$FILES" | xargs git rm -rf --; fi
              )
            fi
            DEST_PATH="$(pwd)/${{ env.dest_path_prefix }}"
            mkdir -p "$DEST_PATH"
            cp -R "$RUNNER_TEMP/site/." "$DEST_PATH/"
            touch "$DEST_PATH/.nojekyll"
            git add .
            git add .nojekyll
            if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
            git commit -m "Deployed DOSVBox website (${{ env.source_git_hash }})"
            git push origin HEAD:master
